<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get started · FocusGuard AI</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="ui.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .wrap { flex: 1; display: grid; place-items: start center; padding: 6vh 16px 48px; }
  .card { width: min(680px, 100%); }
  .progress { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .progress i { display: block; height: 100%; background: var(--tide); border-radius: 999px; transition: width .3s ease; }
  .step-count { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  h1.q { font-size: clamp(26px, 4vw, 34px); line-height: 1.18; letter-spacing: -0.02em; margin-bottom: 10px; }
  .help { color: var(--muted); font-size: 16px; margin-bottom: 26px; max-width: 54ch; }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .choices.one { grid-template-columns: 1fr; }
  .choice {
    appearance: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px;
    display: flex; gap: 12px; align-items: flex-start; transition: border-color .15s, background-color .15s;
  }
  .choice:hover { border-color: var(--faint); }
  .choice[aria-pressed="true"] { border-color: var(--tide); background: var(--tide-soft); }
  .choice .tick { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--faint); margin-top: 2px; display: grid; place-items: center; }
  .choice.radio .tick { border-radius: 50%; }
  .choice[aria-pressed="true"] .tick { background: var(--tide); border-color: var(--tide); }
  .choice[aria-pressed="true"] .tick::after { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--on-tide); }
  .choice.radio[aria-pressed="true"] .tick::after { border-radius: 50%; }
  .choice b { display: block; font-weight: 600; }
  .choice span.t { color: var(--muted); font-size: 14px; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .big-input { font-size: 20px; padding: 14px 16px; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; gap: 12px; }
  .nav .right { display: flex; gap: 10px; align-items: center; }
  .times { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .times input { width: 140px; }
  .plan { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 10px; }
  .plan li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .protect { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 8px; }
  .protect .row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .protect p { color: var(--muted); font-size: 14px; }
  .list-row { display: flex; gap: 8px; }
  .list-row .input { flex: 1; }
  .chips-list { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips-list li { display: inline-flex; align-items: center; gap: 4px; background: var(--tide-soft); border: 1px solid var(--tide);
                   border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 14px; font-weight: 550; }
  .chips-list button { appearance: none; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 17px; line-height: 1; padding: 0 6px; border-radius: 999px; }
  .chips-list button:hover { color: var(--ink); }
  .err { color: var(--danger); font-size: 14px; margin-top: 6px; }
  .field + .field { margin-top: 18px; }
  .choices + .field { margin-top: 20px; }
  @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <main class="card" aria-live="polite">
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="step-count" id="count"></div>
    <h1 class="q" id="q" tabindex="-1"></h1>
    <p class="help" id="help"></p>
    <div id="body"></div>
    <div class="nav">
      <button class="btn btn-text" id="back">Back</button>
      <div class="right">
        <button class="btn btn-text" id="skip">Skip</button>
        <button class="btn btn-primary btn-lg" id="next">Continue</button>
      </div>
    </div>
  </main>
</div>
<script src="src/sites.js"></script>
<script src="src/store.js"></script>
<script src="src/profile.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
