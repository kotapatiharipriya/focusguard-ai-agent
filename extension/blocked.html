<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked · FocusGuard AI</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="ui.css">
<style>
  body { min-height: 100vh; }
  .shell { max-width: 900px; margin: 0 auto; padding: 0 24px 56px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 8px; }
  .top a.quiet { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 550; padding: 6px 10px; border-radius: 8px; }
  .top a.quiet:hover { color: var(--ink); background: var(--surface); }

  /* The stop: one calm, unmistakable statement. */
  .stop { padding: 6vh 0 28px; }
  .mark { width: 56px; height: 56px; border-radius: 16px; background: var(--buoy-soft); display: grid; place-items: center; margin-bottom: 22px; }
  .mark svg { width: 28px; height: 28px; stroke: var(--buoy); }
  h1.title { font-size: clamp(32px, 5.4vw, 52px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 700; max-width: 18ch; }
  .sub { margin-top: 14px; font-size: 17px; color: var(--muted); max-width: 60ch; }
  .goal { margin-top: 16px; display: inline-flex; gap: 8px; align-items: baseline; background: var(--surface); border: 1px solid var(--line);
          border-radius: 999px; padding: 7px 14px; font-size: 15px; }
  .goal b { color: var(--tide-strong); font-weight: 650; }

  .offer { background: var(--surface); border: 1.5px solid var(--tide); border-radius: 18px; padding: 18px 20px; margin-bottom: 8px; }
  .offer-tag { font-size: 13px; font-weight: 650; color: var(--tide-strong); }
  .offer-msg { font-size: 18px; font-weight: 600; margin: 6px 0 14px; line-height: 1.35; max-width: 60ch; }
  .offer-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .agent-plan { margin-top: 12px; font-size: 15px; color: var(--ink); max-width: 64ch; }
  .agent-plan b { color: var(--tide-strong); font-weight: 650; }
  h2.section { font-size: 15px; font-weight: 650; margin: 30px 0 12px; color: var(--ink); }

  /* Three ways out, each one click. */
  .ways { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 12px; }
  .way {
    appearance: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px;
    display: flex; flex-direction: column; gap: 10px; min-height: 168px; transition: border-color .15s, transform .15s;
  }
  .way:hover { border-color: var(--tide); }
  .way:active { transform: translateY(1px); }
  .way .ico { width: 38px; height: 38px; border-radius: 11px; background: var(--tide-soft); display: grid; place-items: center; }
  .way .ico svg { width: 20px; height: 20px; stroke: var(--tide-strong); }
  .way b { font-size: 17px; line-height: 1.25; font-weight: 650; overflow-wrap: anywhere; }
  .way span.t { color: var(--muted); font-size: 14px; }
  .way.primary { background: var(--tide); border-color: var(--tide); color: var(--on-tide); }
  .way.primary .ico { background: rgba(255,255,255,.18); }
  .way.primary .ico svg { stroke: var(--on-tide); }
  .way.primary span.t { color: var(--on-tide); opacity: .85; }
  .way.primary:hover { background: var(--tide-strong); }
  .way-wrap { display: flex; flex-direction: column; gap: 8px; }
  .swap { display: flex; flex-wrap: wrap; gap: 6px; }
  .swap button { appearance: none; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--muted); background: transparent;
                 border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .swap button[aria-pressed="true"] { color: var(--ink); border-color: var(--tide); background: var(--tide-soft); }

  /* Task list */
  .tasks { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .tasks li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .tasks li:first-child { border-top: 0; }
  .tasks li span { flex: 1; overflow-wrap: anywhere; }
  .tasks li.sub span { padding-left: 18px; font-size: 14.5px; }
  .add { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .add .input { flex: 1; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { appearance: none; font: inherit; font-size: 14px; font-weight: 550; cursor: pointer; color: var(--ink);
          background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; }
  .chip:hover { border-color: var(--buoy); }
  .answer { margin-top: 10px; font-weight: 550; }

  .foot { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; color: var(--muted); font-size: 14px; }
  .pass form { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pass .input { min-width: 260px; flex: 1; }
  .err { color: var(--danger); font-size: 14px; margin-top: 6px; }

  /* 2-minute reset */
  .reset { text-align: center; padding: 8vh 0 0; }
  .breath { width: min(300px, 70vw); aspect-ratio: 1; margin: 0 auto 28px; position: relative; display: grid; place-items: center; }
  .breath .orb { position: absolute; inset: 18%; border-radius: 50%; background: var(--tide-soft); border: 2px solid var(--tide);
                 animation: breathe 10s ease-in-out infinite; }
  .breath .clock { position: relative; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 44px; font-weight: 600; }
  @keyframes breathe { 0%, 100% { transform: scale(.78); } 40% { transform: scale(1.08); } 55% { transform: scale(1.08); } }
  .reset h1 { font-size: clamp(24px, 3.6vw, 32px); letter-spacing: -0.02em; min-height: 2.6em; max-width: 26ch; margin: 0 auto; }
  .reset .hint { color: var(--muted); margin-top: 8px; }
  .reset .row { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 18px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--tide); }

  @media (prefers-reduced-motion: reduce) { .breath .orb { animation: none; } }
  @media (max-width: 760px) { .ways { grid-template-columns: 1fr; } .way { min-height: 0; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="focus.html"><img src="icons/icon48.png" alt="">FocusGuard AI</a>
    <nav><a class="quiet" href="focus.html">Tasks</a><a class="quiet" href="report.html">Report</a><a class="quiet" href="options.html">Settings</a></nav>
  </header>

  <main id="main">
    <section class="stop">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
      </div>
      <h1 class="title" id="title">You blocked this site.</h1>
      <p class="sub" id="sub"></p>
      <div class="goal" id="goal" hidden><b>Your goal</b><span id="goalText"></span></div>
      <p class="agent-plan" id="agentPlan" hidden></p>
    </section>

    <section class="offer" id="offer" hidden aria-live="polite">
      <p class="offer-tag">Your FocusGuard AI agent</p>
      <p class="offer-msg" id="offerMsg"></p>
      <div class="offer-row">
        <button class="btn btn-primary btn-lg" id="offerGo">Start</button>
        <button class="btn btn-text" id="offerNo">Not now</button>
      </div>
    </section>

    <section id="inFocus" hidden>
      <button class="btn btn-primary btn-lg" id="backToFocus">Back to my focus session</button>
    </section>

    <section id="waysSection">
      <h2 class="section">Do this instead, right now</h2>
      <div class="ways">
        <button class="way primary" id="wayFocus">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l12 7-12 7z"/></svg></span>
          <b id="wayFocusTitle">Start a focus session</b>
          <span class="t" id="wayFocusText">25 minutes. Every distracting site stays closed.</span>
        </button>
        <div class="way-wrap">
          <button class="way" id="wayAway">
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
            <b id="wayAwayTitle">Take a short walk</b>
            <span class="t">10 minutes away from the screen. I'll keep the time.</span>
          </button>
          <div class="swap" id="swap" aria-label="Pick something else to do"></div>
        </div>
        <button class="way" id="wayReset">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg></span>
          <b>2-minute reset</b>
          <span class="t">Stand up, stretch, breathe, drink water. Then choose.</span>
        </button>
      </div>

      <h2 class="section">Or start on one of your tasks</h2>
      <ul class="tasks" id="tasks"></ul>

      <h2 class="section" id="whyQ">What pulled you here?</h2>
      <div class="chips" id="why">
        <button class="chip" data-reason="bored">Bored</button>
        <button class="chip" data-reason="avoiding">Avoiding something</button>
        <button class="chip" data-reason="tired">Tired</button>
        <button class="chip" data-reason="stress">Stressed</button>
        <button class="chip" data-reason="habit">Just habit</button>
      </div>
      <p class="answer" id="whyAnswer" hidden></p>
    </section>

    <footer class="foot">
      <span id="today"></span>
      <div class="pass" id="pass" hidden>
        <button class="btn btn-text" id="passAsk">I need this site for something specific</button>
        <form id="passForm" hidden>
          <input class="input" id="passReason" maxlength="120" placeholder="What do you need it for?" autocomplete="off">
          <button class="btn btn-quiet" type="submit" id="passGo">Open for 5 minutes</button>
        </form>
        <p class="err" id="passErr" hidden></p>
      </div>
    </footer>
  </main>

  <main id="resetView" class="reset" hidden aria-live="polite">
    <div class="breath" aria-hidden="true"><div class="orb"></div><div class="clock" id="resetClock">2:00</div></div>
    <h1 id="resetStep">Stand up and stretch your arms over your head.</h1>
    <p class="hint">Breathe in as the circle grows, out as it shrinks.</p>
    <div class="dots" id="resetDots"></div>
    <div class="row" id="resetEnd" hidden>
      <button class="btn btn-primary btn-lg" id="resetFocus">Start a focus session</button>
      <button class="btn btn-quiet btn-lg" id="resetTasks">See my tasks</button>
    </div>
    <div class="row"><button class="btn btn-text" id="resetSkip">Skip the rest</button></div>
  </main>
</div>
<script src="src/sites.js"></script>
<script src="src/store.js"></script>
<script src="src/profile.js"></script>
<script src="blocked.js"></script>
</body>
</html>
